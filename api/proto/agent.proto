syntax = "proto3";
message Empty {}

message Node {
  string id = 1;
  string addr = 2;              // host:port
  string service = 3;           // optional
  int64  last_heartbeat = 4;    // unix seconds
}

message GetLocalViewRequest {
  string service = 1;           // optional filter
}
message GetLocalViewResponse {
  repeated Node nodes = 1;
}

service AgentService {
  rpc GetLocalView(GetLocalViewRequest) returns (GetLocalViewResponse);
}
