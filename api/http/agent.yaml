openapi: 3.0.3
info:
  title: Flock Agent REST API
  version: 0.1.0
  description: >
    Minimal REST API for the Flock Agent.  
    Allows querying the agent's local membership view and retrieving a random node sample.

servers:
  - url: http://localhost:8080
    description: Local development server

paths:
  /healthz:
    get:
      summary: Health check
      operationId: healthz
      responses:
        '200':
          description: Agent is healthy
          content:
            text/plain:
              schema:
                type: string
                example: ok

  /api/v1/nodes:
    get:
      summary: List all alive nodes known by the agent
      operationId: listNodes
      tags: [nodes]
      parameters:
        - name: name
          in: query
          required: false
          description: Optional service name to filter nodes by
          schema:
            type: string
      responses:
        '200':
          description: List of alive nodes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Node'
              examples:
                example:
                  value:
                    - id: 8d312a3f
                      ip: 10.0.0.11
                      port: 7946
                      service_name: payments
                      last_heartbeat: 1730580000
                    - id: 2ac34e11
                      ip: 10.0.0.12
                      port: 7946
                      service_name: auth
                      last_heartbeat: 1730580005
        '500':
          $ref: '#/components/responses/InternalError'

components:
  schemas:
    Node:
      type: object
      required:
        - id
        - ip
        - port
        - service_name
        - last_heartbeat
      properties:
        id:
          type: string
          description: Autogenerated short, unique node identifier
          example: 8d312a3f
        ip:
          type: string
          description: Node IP address
          example: 10.0.0.11
        port:
          type: integer
          description: Node gossip port
          example: 7946
        service_name:
          type: string
          description: Logical service name
          example: payments
        last_heartbeat:
          type: integer
          format: int64
          description: Unix timestamp (seconds) of the node's last heartbeat
          example: 1730580000

    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
        details:
          type: string
          nullable: true

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "n must be >= 1"
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "internal error"
