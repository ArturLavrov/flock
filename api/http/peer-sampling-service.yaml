openapi: 3.0.3
info:
  title: Peer Sampling Service API
  version: 1.0.0
  description: >
    Minimal API for retrieving a random subset of nodes currently known to the system.
servers:
  - url: http://localhost:8081
    description: Local development

paths:
  /v1/nodes:
    get:
      summary: Get a random subset of nodes
      description: >
        Returns a randomly selected subset of known nodes in the cluster.
        The number of nodes returned is controlled by the `limit` parameter.
      parameters:
        - name: limit
          in: query
          description: Maximum number of nodes to return.
          required: false
          schema:
            type: integer
            minimum: 1
            default: 5
      responses:
        '200':
          description: A list of sampled nodes.
          content:
            application/json:
              schema:
                type: object
                properties:
                  nodes:
                    type: array
                    items:
                      $ref: '#/components/schemas/Node'
                required:
                  - nodes
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    Node:
      type: object
      description: Basic node descriptor.
      properties:
        id:
          type: string
          description: Unique node identifier within the cluster.
          example: "node-8d312a3f"
        addr:
          type: string
          description: Host and port to reach this node (ip:port or host:port).
          example: "10.0.0.12:5000"
        tag:
          type: string
          description: Node tag used for grouping or filtering.
          example: "payments"
        last_heartbeat:
          type: integer
          format: int64
          description: Unix timestamp (seconds) of the node's last heartbeat.
          example: 1730580000
      required:
        - id
        - addr
        - last_heartbeat
    Error:
      type: object
      properties:
        message:
          type: string
      required:
        - message
