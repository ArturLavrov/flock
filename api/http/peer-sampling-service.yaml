openapi: 3.0.3
info:
  title: Peer Sampling Service API
  version: 1.0.0
  description: >
    Minimal API for retrieving a random subset of nodes currently known to the system.
servers:
  - url: http://localhost:8081
    description: Local development

paths:
  /api/v1/nodes:
    get:
      summary: Get a random subset of nodes
      description: >
        Returns a randomly selected subset of known nodes in the cluster.
        The number of nodes returned is controlled by the `limit` parameter.
      parameters:
        - name: limit
          in: query
          description: Maximum number of nodes to return.
          required: false
          schema:
            type: integer
            minimum: 1
            default: 5
      responses:
        '200':
          description: A list of sampled nodes.
          content:
            application/json:
              schema:
                type: object
                properties:
                  nodes:
                    type: array
                    items:
                      $ref: '#/components/schemas/Node'
                required:
                  - nodes
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    Node:
      type: object
      description: Basic node descriptor.
      properties:
        id:
          type: string
          description: Autogenerated short, unique node identifier.
          example: "8d312a3f"
        ip:
          type: string
          description: Node IP address.
          example: "10.0.0.12"
        port:
          type: integer
          description: Node gossip port.
          example: 5000
        service_name:
          type: string
          description: Logical service name.
          example: "pss"
        last_heartbeat:
          type: integer
          format: int64
          description: Unix timestamp (seconds) of the node's last heartbeat.
          example: 1730580000
      required:
        - id
        - ip
        - port
        - service_name
        - last_heartbeat
    Error:
      type: object
      properties:
        message:
          type: string
      required:
        - message
